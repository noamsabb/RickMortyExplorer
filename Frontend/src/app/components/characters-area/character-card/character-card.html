<div class="character-card" (mouseleave)="moreInfoFlag = false">

  <button (click)="clickFavorite()">{{isFavoriteFlag ? '❤️': '🤍'}}</button>
  
  <img [src]="character.image" />
  <p>{{ character.name }}</p>
  <p>{{ character.status }}</p>
  <p>{{ character.type }}</p>
  <p><strong>Species:</strong> {{ character.species }}</p>

  <button (click)="moreInfoFlag = !moreInfoFlag">Open Modal</button>

  <!-- More Info modal -->
  <div *ngIf="moreInfoFlag" class="moreInfo-modal">
    <div>
      <app-character-details [character]="character"> </app-character-details>
    </div>

  </div>
  
</div>
